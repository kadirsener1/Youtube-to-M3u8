name: Update M3U Playlist

on:
  schedule:
    # Her 4 saatte bir otomatik çalışır (token süresi dolmadan yenilenmesi için)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Manuel tetikleme seçeneği

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Actions'ın repo içine commit atabilmesi için yazma izni

    steps:
      - name: Repository'yi Kopyala
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: M3U Güncelleme Betiğini Çalıştır
        run: python update_playlist.py

      - name: Değişiklikleri GitHub'a Otomatik Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.sk"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update CNN Turk m3u8 playlist [skip ci]" && git push)
