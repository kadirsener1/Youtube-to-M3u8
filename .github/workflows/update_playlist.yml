name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository'yi Kopyala
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secrets içinden cookies.txt Dosyasını Python ile Oluştur
        env:
          YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          b64_data = os.getenv('YOUTUBE_COOKIES_BASE64')
          if b64_data:
              decoded_bytes = base64.b64decode(b64_data)
              with open('cookies.txt', 'wb') as f:
                  f.write(decoded_bytes)
              print('cookies.txt başarıyla oluşturuldu.')
          else:
              print('HATA: YOUTUBE_COOKIES_BASE64 secret boş veya bulunamadı!')
          "

      - name: M3U Güncelleme Betiğini Çalıştır
        run: python update_playlist.py

      - name: Gizli Çerez Dosyasını Temizle (Güvenlik)
        if: always()
        run: rm -f cookies.txt

      - name: Değişiklikleri GitHub'a Otomatik Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.sk"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update CNN Turk m3u8 playlist [skip ci]" && git push)
