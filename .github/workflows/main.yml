    def generate_epg(self, channels_data):
        tv = ET.Element("tv", {
            "generator-info-name": "YouTube Live EPG Generator",
            "date": datetime.now().strftime("%Y%m%d%H%M%S %Z")
        })
        
        for channel in channels_data:
            if channel.get('status') == 'live':
                channel_elem = ET.SubElement(tv, "channel", {"id": channel['channel_id']})
                display_name = ET.SubElement(channel_elem, "display-name")
                display_name.text = channel['name']
                
                if channel.get('logo'):
                    ET.SubElement(channel_elem, "icon", {"src": channel['logo']})
                
                programme = ET.SubElement(tv, "programme", {
                    "start": datetime.now().strftime("%Y%m%d%H%M%S +0000"),
                    "stop": (datetime.now() + timedelta(hours=1)).strftime("%Y%m%d%H%M%S +0000"),
                    "channel": channel['channel_id']
                })
                
                title = ET.SubElement(programme, "title")
                title.text = channel.get('title', 'Live Stream')
                
                desc = ET.SubElement(programme, "desc")
                desc.text = f"Live YouTube stream from {channel['name']}"
                
                category = ET.SubElement(programme, "category")
                category.text = "Live"
        
        rough_string = ET.tostring(tv, encoding='unicode')
        reparsed = minidom.parseString(rough_string)
        pretty_xml = reparsed.toprettyxml(indent="  ", encoding='utf-8').decode('utf-8')
        
        with open('epg.xml', 'w', encoding='utf-8') as f:
            f.write(pretty_xml)
        print(f"✅ EPG generated successfully")
    
    def generate_playlists(self, all_channels):
        playlists = {'main': [], 'hd': [], 'mobile': [], 'audio': []}
        headers = [
            "#EXTM3U",
            "#EXT-X-VERSION:3",
            f"# Generated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}",
            f"# Total channels: {len(all_channels)}",
            ""
        ]
        
        for p in playlists:
            playlists[p] = headers.copy()
        
        stats = {'total': len(all_channels), 'live': 0, 'offline': 0, 'qualities': {'1080p': 0, '720p': 0, '480p': 0}}
        
        for channel in all_channels:
            channel_name = channel.get('name', 'Unknown')
            channel_id = channel.get('channel_id', '')
            logo_attr = f' tvg-logo="{channel["logo"]}"' if channel.get('logo') else ''
            
            if channel.get('status') == 'live':
                stats['live'] += 1
                main_stream = channel.get('streams', {}).get('hd', {})
                if not main_stream:
                    for s in channel.get('streams', {}).values():
                        main_stream = s
                        break
                
                if main_stream:
                    quality_tag = main_stream.get('quality_tag', '')
                    playlists['main'].append(f'#EXTINF:-1 tvg-id="{channel_id}"{logo_attr} tvg-name="{channel_name}" group-title="General",{channel_name} [{quality_tag}]')
                    playlists['main'].append(main_stream['url'])
                    playlists['main'].append("")
            else:
                stats['offline'] += 1
                fallback_url = f"https://www.youtube.com/watch?v={channel.get('video_id', '')}"
                playlists['main'].append(f'#EXTINF:-1 tvg-id="{channel_id}"{logo_attr} tvg-name="{channel_name}" group-title="General",{channel_name} [Offline]')
                playlists['main'].append(fallback_url)
                playlists['main'].append("")
        
        playlist_files = {
            'main': 'streams.m3u8',
            'hd': 'streams_hd.m3u8',
            'mobile': 'streams_mobile.m3u8'
        }
        
        for name, filename in playlist_files.items():
            with open(filename, 'w', encoding='utf-8') as f:
                f.write('\n'.join(playlists[name]))
            print(f"✅ Saved: {filename}")
        
        with open('stats.json', 'w') as f:
            json.dump(stats, f, indent=2)
        
        return stats, playlists

def main():
    if not os.path.exists('streams.txt'):
        print("❌ streams.txt not found")
        return
    
    with open('streams.txt', 'r') as f:
        lines = [l.strip() for l in f if l.strip() and not l.startswith('#')]
    
    if not lines:
        print("⚠️ No streams found")
        return
    
    print(f"📡 Processing {len(lines)} channels...")
    generator = YouTubePlaylistGenerator()
    
    channels_data = []
    for i, url in enumerate(lines, 1):
        print(f"\n📺 [{i}/{len(lines)}] Processing: {url}")
        time.sleep(random.uniform(1, 3))
        info = generator.get_stream_info(url)
        if info:
            channels_data.append(info)
        else:
            channels_data.append({
                'status': 'error',
                'url': url,
                'name': 'Unknown',
                'channel_id': f'error_{i}'
            })
    
    print("\n📋 Generating individual playlists...")
    generator.generate_individual_playlists(channels_data)
    
    print("\n📺 Generating EPG guide...")
    generator.generate_epg(channels_data)
    
    print("\n📂 Generating main playlists...")
    generator.generate_playlists(channels_data)
    
    generator.save_cache()
    print("\n✨ All generation tasks completed successfully!")

if __name__ == '__main__':
    main()
