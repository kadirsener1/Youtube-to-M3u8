name: Auto Update Playlist

on:
  schedule:
    # Her saat başı çalışır (İhtiyacına göre düzenleyebilirsin)
    - cron: '0 * * * *'
  workflow_dispatch: # Manuel olarak da başlatabilmen için

permissions:
  contents: write # Repoya push yapabilmesi için gerekli yazma izni

# Aynı anda iki işlemin çakışıp "cannot lock ref" hatası vermesini engeller
concurrency:
  group: playlist-update-group
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run update script
        env:
          PYTHONUNBUFFERED: 1
        run: |
          # Kendi Python dosyanın adını buraya yaz (Örn: main.py veya update.py)
          python generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add streams*.m3u8 epg.xml stats.json logos/ channels/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update playlist - $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Uzak depoda yeni değişiklik varsa çek ve çakışma olursa yeni üretilenleri koru
          git pull origin main --rebase -X ours || true

          git push origin HEAD:main
