name: Auto Update Playlist

on:
  schedule:
    # Her saat başı çalışır (İstediğin gibi değiştirebilirsin)
    - cron: '0 * * * *'
  workflow_dispatch: # Manuel olarak da çalıştırabilmen için

permissions:
  contents: write # GitHub Actions'ın repoya push yapabilmesi için gerekli yetki

# Aynı anda birden fazla tetikleme çakışıp "cannot lock ref" hatası vermesin diye
concurrency:
  group: playlist-update-group
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Eğer requirements.txt varsa onu kurar, yoksa doğrudan yt_dlp ve diğerlerini kurar
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt_dlp requests pillow
          fi

      - name: Run update script
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add streams*.m3u8 epg.xml stats.json logos/ channels/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update playlist - $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Uzak depodaki olası güncellemeleri çekip çakışmaları önler
          git pull origin main --rebase -X ours || true

          git push origin HEAD:main
