name: Auto Update Playlist

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: write

concurrency:
  group: playlist-update-group
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: python-setup/action@v5 # veya actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt_dlp requests pillow
          fi

      - name: Setup Cookies File from Secrets
        run: |
          echo "${{ secrets.COOKIES_TXT }}" > cookies.txt

      - name: Run update script
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add streams*.m3u8 epg.xml stats.json logos/ channels/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update playlist - $(date -u +'%Y-%m-%d %H:%M UTC')"

          git pull origin main --rebase -X ours || true

          git push origin HEAD:main
