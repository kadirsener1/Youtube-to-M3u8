name: YouTube Live M3U8 Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests

      - name: Create cookies file
        env:
          COOKIES: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -z "$COOKIES" ]; then
            echo "COOKIES_TXT secret missing"
            exit 1
          fi
          echo "$COOKIES" > cookies.txt

      - name: Create directories
        run: |
          mkdir -p logos channels

      - name: Run playlist generator
        run: |
          python generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streams*.m3u8 epg.xml stats.json logos/ channels/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update playlist - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.ref_name }}
